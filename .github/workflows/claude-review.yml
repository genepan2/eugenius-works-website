name: Claude review

# Claude reviews every pull request once it opens and again after each push, and
# leaves its findings as comments. It is advice, not a required check.
# Needs the Claude GitHub App (https://github.com/apps/claude) on this repository and
# one repository secret: CLAUDE_CODE_OAUTH_TOKEN (Claude subscription, from
# `claude setup-token`) or ANTHROPIC_API_KEY. Without either it skips itself.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Bots open release and dependency PRs; their diffs need no review and get no secrets.
    if: github.event.pull_request.draft == false && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Skip when no Claude credential is set
        id: gate
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$OAUTH" ] && [ -z "$KEY" ]; then
            echo "Neither CLAUDE_CODE_OAUTH_TOKEN nor ANTHROPIC_API_KEY is set; no review." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - if: steps.gate.outputs.ready == 'true'
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The PR branch is checked out in the working directory.
            Read AGENTS.md first: it holds the project's rules. DESIGN.md is binding for any
            visual change, and docs/openapi.json is the contract of src/worker.ts.

            Report only problems you are confident about:
            - bugs and wrong behavior
            - security issues, and personal data reaching a log line
            - a break of a rule in AGENTS.md or DESIGN.md
            - a Worker change without the matching change in docs/openapi.json and tests

            Skip style points that Prettier or ESLint already enforce, and skip praise.
            Use mcp__github_inline_comment__create_inline_comment (with confirmed: true) for a
            problem on a specific line. Then post one short summary with `gh pr comment`.
            If you find nothing, the summary says so in one line.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep"
