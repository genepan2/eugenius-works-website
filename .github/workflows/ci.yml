name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, type-check and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run knip
      - run: npm run duplicates
      - run: npm run secrets
      - run: npm run size:files
      - run: npm run todos
      - name: Build
        run: |
          start=$(date +%s)
          npm run build
          echo "### Build took $(( $(date +%s) - start )) s" >> "$GITHUB_STEP_SUMMARY"
      - run: npm run size:bundle
      - run: npm test
      - name: Keep the test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: test-results/
      - name: Keep the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://eugenius-works.com
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Skip when Cloudflare is not set up
        id: gate
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is not set; deploy with npm run deploy instead." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.ready == 'true'
        run: npm ci && npm run build
      - if: steps.gate.outputs.ready == 'true'
        id: deploy
        run: npx wrangler deploy --message "${{ github.sha }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Check the live health
        id: health
        if: steps.gate.outputs.ready == 'true'
        run: |
          sleep 10
          curl --fail --silent --show-error --retry 3 --retry-delay 5 https://eugenius-works.com/api/health
          echo "Deployed ${{ github.sha }} to https://eugenius-works.com" >> "$GITHUB_STEP_SUMMARY"
      # Only after a deploy that went out and then failed its health check: without a
      # version ID, wrangler returns the Worker to the version that ran before this one.
      - name: Roll back when the live health fails
        if: failure() && steps.deploy.outcome == 'success' && steps.health.outcome == 'failure'
        run: |
          npx wrangler rollback --yes --message "Health check failed after ${{ github.sha }}"
          echo "### Rolled back: /api/health failed after deploying ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
