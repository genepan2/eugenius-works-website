name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, type-check and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run knip
      - run: npm run duplicates
      - run: npm run secrets
      - run: npm run size:files
      - run: npm run todos
      - name: Build
        run: |
          start=$(date +%s)
          npm run build
          echo "### Build took $(( $(date +%s) - start )) s" >> "$GITHUB_STEP_SUMMARY"
      - run: npm run size:bundle
      - run: npm test
      - name: Report test durations
        if: always()
        run: node scripts/test-report.ts
      - name: Keep the test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: test-results/
      - name: Keep the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://eugenius-works.com
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Skip when Cloudflare is not set up
        id: gate
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is not set; deploy with npm run deploy instead." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.ready == 'true'
        run: npm ci && npm run build
      # Gradual rollout: upload the new version without traffic, smoke-test it through a
      # version override, give it 10 % of traffic for a minute, then all of it. Any failed
      # check puts the old version back to 100 %.
      - name: Upload the new version without traffic
        id: upload
        if: steps.gate.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler.ndjson
        run: |
          old=$(npx wrangler deployments status --json | jq -r '.versions | max_by(.percentage) | .version_id')
          npx wrangler versions upload --message "${{ github.sha }}"
          new=$(jq -r 'select(.type == "version-upload") | .version_id' "$WRANGLER_OUTPUT_FILE_PATH")
          [ -n "$old" ] && [ -n "$new" ] && [ "$old" != null ] && [ "$new" != null ]
          echo "old=$old" >> "$GITHUB_OUTPUT"
          echo "new=$new" >> "$GITHUB_OUTPUT"
          npx wrangler versions deploy "$new@0" "$old@100" --yes --message "${{ github.sha }} at 0 %"
      - name: Smoke-test the new version
        id: smoke
        if: steps.gate.outputs.ready == 'true'
        env:
          OVERRIDE: 'Cloudflare-Workers-Version-Overrides: eugenius-works-website="${{ steps.upload.outputs.new }}"'
        run: |
          sleep 10
          for path in /api/health / /contact/; do
            curl --fail --silent --show-error --output /dev/null --retry 3 --retry-delay 5 \
              -H "$OVERRIDE" "https://eugenius-works.com$path"
          done
      - name: Send 10 % of traffic to the new version for a minute
        id: canary
        if: steps.gate.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEW: ${{ steps.upload.outputs.new }}
          OLD: ${{ steps.upload.outputs.old }}
        run: |
          npx wrangler versions deploy "$NEW@10" "$OLD@90" --yes --message "${{ github.sha }} at 10 %"
          for i in 1 2 3 4 5 6; do
            sleep 10
            curl --fail --silent --show-error --output /dev/null --retry 2 --retry-delay 3 https://eugenius-works.com/api/health
          done
      - name: Send all traffic to the new version
        id: deploy
        if: steps.gate.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler versions deploy "${{ steps.upload.outputs.new }}@100" --yes --message "${{ github.sha }}"
      - name: Check the live health
        id: health
        if: steps.gate.outputs.ready == 'true'
        run: |
          sleep 10
          curl --fail --silent --show-error --retry 3 --retry-delay 5 https://eugenius-works.com/api/health
          echo "Deployed ${{ github.sha }} to https://eugenius-works.com" >> "$GITHUB_STEP_SUMMARY"
      - name: Put the old version back when a check fails
        if: failure() && steps.upload.outputs.old != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler versions deploy "${{ steps.upload.outputs.old }}@100" --yes --message "Rolled back from ${{ github.sha }}"
          echo "### Rolled back: a check failed while rolling out ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
